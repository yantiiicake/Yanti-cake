<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YANTI CAKE</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#fff5f8;color:#5d3b45;min-height:100vh;overflow-x:hidden}
.bg{position:fixed;inset:0;overflow:hidden;pointer-events:none}.blob{position:absolute;border-radius:50%;filter:blur(3px);opacity:.55;animation:float 7s ease-in-out infinite}.b1{width:180px;height:180px;background:#ffd1df;left:-60px;top:70px}.b2{width:220px;height:220px;background:#ffe6a8;right:-80px;top:230px;animation-delay:1s}.b3{width:140px;height:140px;background:#d9f5df;left:8%;bottom:30px;animation-delay:2s}
.wrap{width:min(94%,560px);margin:auto;padding:34px 0 28px;position:relative}.card{text-align:center;background:rgba(255,255,255,.78);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.9);border-radius:30px;padding:28px 20px 24px;box-shadow:0 18px 55px rgba(130,75,95,.13)}
.logo{width:105px;height:105px;margin:0 auto 12px;border-radius:50%;background:linear-gradient(145deg,#fff,#ffd5e2);display:grid;place-items:center;font-size:48px;box-shadow:0 10px 25px rgba(220,110,145,.2);animation:bob 3s ease-in-out infinite}.cake{animation:wiggle 2.5s ease-in-out infinite;display:inline-block}
h1{margin:0;font-size:30px;letter-spacing:1px;color:#8e4960}p{margin:7px 0 21px;color:#80636c}.tag{display:inline-block;background:#fff0f5;padding:7px 13px;border-radius:99px;font-size:13px;color:#a25670;margin-bottom:18px}
.links{display:grid;gap:12px}.link{display:flex;align-items:center;gap:13px;text-decoration:none;color:#5d3b45;background:#fff;border:1px solid #f5dce5;padding:15px 17px;border-radius:18px;font-weight:700;box-shadow:0 7px 18px rgba(130,75,95,.07);transition:.22s}.link:hover{transform:translateY(-3px) scale(1.01);box-shadow:0 12px 25px rgba(130,75,95,.13)}.ico{width:38px;height:38px;border-radius:13px;display:grid;place-items:center;font-size:21px;background:#fff1f5}.link span:last-child{margin-left:auto;font-size:20px;color:#c78b9f}
.note{margin:20px 0 0;font-size:13px;color:#a17b86}.sprinkles{position:relative;height:32px;margin-top:10px}.sprinkles span{position:absolute;font-size:20px;animation:fall 3s ease-in-out infinite}.s1{left:10%;}.s2{left:31%;animation-delay:.6s}.s3{left:57%;animation-delay:1.2s}.s4{left:82%;animation-delay:1.8s}
footer{text-align:center;font-size:12px;color:#b18b96;margin-top:18px}
@keyframes float{50%{transform:translateY(-22px) translateX(12px)}}@keyframes bob{50%{transform:translateY(-6px) rotate(2deg)}}@keyframes wiggle{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}@keyframes fall{50%{transform:translateY(-9px) rotate(12deg)}}
</style>
</head>
<body>
<div class="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div></div>
<main class="wrap"><section class="card">
<div class="logo"><span class="cake">🧁</span></div>
<h1>YANTI CAKE</h1>
<div class="tag">🍰 Manisnya bikin happy!</div>
<p>Jual kue &amp; bento cake<br>Pesan kue favoritmu di sini 💕</p>
<div class="links">
<a class="link" href="https://www.tiktok.com/@yanti_cake?_r=1&_t=ZS-99XAyVuCqSz" target="_blank"><span class="ico">🎵</span><span>TikTok Yanti Cake</span><span>›</span></a>
<a class="link" href="https://wa.me/message/ILJEAHWHC2BEL1" target="_blank"><span class="ico">💬</span><span>Pesan via WhatsApp</span><span>›</span></a>
<a class="link" href="https://www.instagram.com/yanti_purple_ungu?stkn=MWpybGhzamcxOXl2Zw%3D%3D&utm_source=qr" target="_blank"><span class="ico">📸</span><span>Instagram</span><span>›</span></a>
<a class="link" href="https://maps.app.goo.gl/f1XSyJsq2CLD3c8cA" target="_blank"><span class="ico">📍</span><span>Lokasi Toko</span><span>›</span></a>
</div>
<div class="sprinkles"><span class="s1">🍓</span><span class="s2">✨</span><span class="s3">🍰</span><span class="s4">💗</span></div>
<div class="note">Dibuat dengan cinta untuk setiap momen spesial ✨</div>
</section><footer>YANTI CAKE • Kue &amp; Bento Cake</footer></main>
</body></html>
