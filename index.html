<!-- ================= MODAL ORDER ================= -->

<div class="modal" id="orderModal">

  <div class="modal-box">

    <button class="close" onclick="tutupForm()">×</button>

    <h2>🧁 Form Pemesanan</h2>

    <div class="form-group">
      <label>Nama</label>
      <input type="text" id="nama" placeholder="Nama kamu">
    </div>

    <div class="form-group">
      <label>Nomor WhatsApp</label>
      <input type="tel" id="nomor" placeholder="08xxxxxxxxxx">
    </div>

    <div class="form-group">
      <label>Pesanan</label>
      <input type="text" id="kue" readonly>
    </div>

    <div class="form-group">
      <label>Jumlah</label>
      <input type="number" id="jumlah" min="1" value="1">
    </div>

    <div class="form-group">
      <label>Tanggal diambil</label>
      <input type="date" id="tanggal_diambil" required>
    </div>

    <div class="form-group">
      <label>Jam diambil</label>
      <input type="time" id="jam_diambil" required>
    </div>

    <div class="form-group">
      <label>Catatan / Request</label>
      <textarea
        id="catatan"
        placeholder="Contoh: tulisan di kue, warna, tanggal pesan, dll."
      ></textarea>
    </div>

    <button class="send-order" onclick="kirimPesanan()">
      💬 Kirim Pesanan ke WhatsApp
    </button>

  </div>

</div>


<script>

const nomorYanti = "62895604755892";


function bukaForm(namaKue){

  document.getElementById("kue").value = namaKue;

  document.getElementById("orderModal").classList.add("show");

  document.body.style.overflow = "hidden";
}


function tutupForm(){

  document.getElementById("orderModal").classList.remove("show");

  document.body.style.overflow = "auto";
}


function kirimPesanan(){

  const nama =
    document.getElementById("nama").value.trim();

  const nomor =
    document.getElementById("nomor").value.trim();

  const kue =
    document.getElementById("kue").value;

  const jumlah =
    document.getElementById("jumlah").value;

  const tanggal =
    document.getElementById("tanggal_diambil").value;

  const jam =
    document.getElementById("jam_diambil").value;

  const catatan =
    document.getElementById("catatan").value.trim();


  if(!nama){
    alert("Nama belum diisi ya 😊");
    return;
  }


  if(!nomor){
    alert("Nomor WhatsApp belum diisi ya 😊");
    return;
  }


  if(!tanggal){
    alert("Tanggal diambil belum dipilih ya 😊");
    return;
  }


  if(!jam){
    alert("Jam diambil belum dipilih ya 😊");
    return;
  }


  const pesan =
`🍰 *PESANAN YANTI CAKE*

👤 Nama: ${nama}
📱 No. WhatsApp: ${nomor}
🎂 Kue: ${kue}
🔢 Jumlah: ${jumlah}
📅 Tanggal diambil: ${tanggal}
⏰ Jam diambil: ${jam}
📝 Catatan: ${catatan || "-"}

Mohon konfirmasi pesanan saya ya 🙏`;


  const url =
    "https://wa.me/" +
    nomorYanti +
    "?text=" +
    encodeURIComponent(pesan);


  window.open(url, "_blank");

  tutupForm();
}


/* Klik area luar modal untuk menutup */

document
  .getElementById("orderModal")
  .addEventListener("click", function(e){

    if(e.target === this){
      tutupForm();
    }

  });

</script>
